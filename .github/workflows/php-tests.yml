name: PHP Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        # Añadimos 8.1 y 8.2 para cumplir con el contrato del composer.json
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php-version }} Tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, dom, curl, libxml, simplexml
        coverage: none
        # Herramientas útiles para debugging si algo falla
        tools: composer:v2

    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      run: |
        # Usamos --ignore-platform-req=php+ para las versiones de desarrollo (8.5)
        composer update --prefer-dist --no-progress --ignore-platform-req=php+

    - name: Run Tests
      run: ./vendor/bin/phpunit tests

  coverage:
    runs-on: ubuntu-latest
    name: Coverage (PHP 8.3)
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP with pcov
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, dom, curl, libxml, simplexml, pcov
        coverage: pcov
        tools: composer:v2

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress

    - name: Run tests with coverage
      run: ./vendor/bin/phpunit -c phpunit.xml.dist --coverage-clover build/coverage.xml

    - name: Generate coverage shield JSON
      run: php scripts/coverage_shield.php build/coverage.xml statguard-coverage.json

    - name: Publish coverage shield to Gist
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: exuanbo/actions-deploy-gist@v1
      with:
        gist_id: 414f8bf15fbe9503c332a5c0a57a699f
        token: ${{ secrets.GIST_TOKEN }}
        gist_file_name: statguard-coverage.json
        file_path: statguard-coverage.json